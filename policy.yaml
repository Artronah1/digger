# policy.yaml — правила ожидаемого сетевого поведения.
#
# Если файл не задан — digger работает как наблюдатель.
# Если задан — digger проверяет и сообщает о нарушениях.

# Разрешённые DNS-резолверы.
# Любой DNS-запрос к IP вне этого списка → ⚠ POLICY-VIOLATION.
dns_resolvers:
  - 192.168.1.1
  - 127.0.0.1

# Домены, которым разрешён прямой outbound (не через прокси).
# (пока не используется — для будущих шагов)
allow_direct:
  - ozon.ru
  - vk.com

# IPv6: разрешён ли трафик.
# false = запрещён, true = разрешён, отсутствует = не проверять.
ipv6: false
